<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sakshamFacetLeft" x1="10" y1="10" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1a3a" />
      <stop offset="50%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>
    <linearGradient id="sakshamFacetRight" x1="90" y1="10" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#061329" />
      <stop offset="50%" stop-color="#0d1b3e" />
      <stop offset="100%" stop-color="#020b18" />
    </linearGradient>
    <linearGradient id="sakshamBladeTop" x1="20" y1="20" x2="80" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="sakshamBladeBottom" x1="80" y1="80" x2="20" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="sakshamCorePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
    <linearGradient id="sakshamRimGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#1e3a8a" />
      <stop offset="85%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Border -->
  <path d="M50 5 L89 24.5 V57.5 L50 94.5 L11 57.5 V24.5 L50 5 Z" stroke="url(#sakshamRimGrad)" stroke-width="4" stroke-linejoin="round" fill="#040814" />
  <path d="M50 8 L15 26.5 V55.5 L50 90.5 V50 Z" fill="url(#sakshamFacetLeft)" opacity="0.9" />
  <path d="M50 8 L85 26.5 V55.5 L50 90.5 V50 Z" fill="url(#sakshamFacetRight)" opacity="0.9" />

  <!-- Upper Interlocking S Chevron -->
  <path d="M74 31 L50 19 L26 31 L26 41 L50 29 L74 41 Z" fill="url(#sakshamBladeTop)" />
  <path d="M74 31 L50 19 L26 31 L50 43 L74 31 Z" fill="#ffffff" fill-opacity="0.2" />

  <!-- Lower Interlocking S Chevron -->
  <path d="M26 69 L50 81 L74 69 L74 59 L50 71 L26 59 Z" fill="url(#sakshamBladeBottom)" />
  <path d="M26 69 L50 81 L74 69 L50 57 L26 69 Z" fill="#ffffff" fill-opacity="0.15" />

  <!-- Connector -->
  <path d="M32 46 L68 54 L68 49 L32 41 Z" fill="url(#sakshamBladeTop)" opacity="0.85" />

  <!-- Core Quantum Diamond -->
  <polygon points="50,42 58,50 50,58 42,50" fill="url(#sakshamCorePulse)" />
  <polygon points="50,45 55,50 50,55 45,50" fill="#ffffff" />
</svg>
